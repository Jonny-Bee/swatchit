<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f2" />
    <meta name="description" content="Make, save, and share colour palettes. Your swatches stay on your device." />
    <title>Swatch it — a little colour goes a long way</title>
  </head>
  <body>
    <div id="root">
      <main aria-label="Swatch it is loading" style="min-height:100vh;padding:24px 30px;font-family:Inter,'Helvetica Neue',Arial,sans-serif;color:#202124">
        <header style="height:40px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eceef0;padding-bottom:16px">
          <strong style="font-size:19px;letter-spacing:-.8px">◩ swatchit</strong>
          <span style="font-size:9px;letter-spacing:1.5px;color:#9699a0">A COLOUR PALETTE GENERATOR</span>
        </header>
        <h1 style="font-size:23px;margin:28px 0 18px">The palette generator</h1>
        <section aria-label="Palette preview" style="height:min(70vh,760px);min-height:390px;display:flex;gap:9px">
          <div style="flex:1;background:#563fbc;border-radius:17px"></div>
          <div style="flex:1;background:#8675d1;border-radius:17px"></div>
          <div style="flex:1;background:#3c485d;border-radius:17px"></div>
          <div style="flex:1;background:#7a88a6;border-radius:17px"></div>
          <div style="flex:1;background:#e5dde9;border-radius:17px"></div>
        </section>
        <noscript><p style="color:#747780;font-size:13px">Enable JavaScript to edit, generate, save, and share colour palettes.</p></noscript>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
